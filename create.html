<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Create room | Yoselins Auctions</title>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="site.css">
    <script defer src="site.js"></script>
  </head>
  <body data-page="create">
    <div class="site-shell">
      <header class="site-header panel">
        <a class="brand" href="home.html" aria-label="Yoselins Auctions home">
          <span class="brand-copy">
            <span class="brand-kicker" data-i18n="brand.kicker">Auction workspace</span>
            <strong data-i18n="brand.name">Yoselins Auctions</strong>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="home.html" data-i18n="nav.home">Home</a>
          <a href="create.html" class="is-active" aria-current="page" data-i18n="nav.create">Create</a>
          <a href="join.html" data-i18n="nav.join">Join</a>
          <a href="rooms.html" data-i18n="nav.auctions">Rooms</a>
          <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
          <a href="admin.html" data-nav="admin" data-i18n="nav.admin">Admin</a>
        </nav>

        <button id="languageToggle" class="language-toggle" type="button" aria-label="Switch language">Español</button>
      </header>

      <main class="page-grid">
        <section class="split-grid single-column">
          <article class="panel form-panel">
            <div class="section-head">
              <div>
                <p class="eyebrow" data-i18n="create.formTitle">Create form</p>
                <h2 data-i18n="create.formSubtitle">Publish the room details.</h2>
              </div>
              <p class="section-note" data-i18n="create.helper">Every room gets a code as soon as you publish it.</p>
            </div>

            <form id="createForm" class="form-grid">
              <div class="field full-span">
                <label for="createTitle" data-i18n="create.fieldTitle">Auction title</label>
                <input id="createTitle" name="title" type="text" placeholder="Office cleaning contract" data-i18n-placeholder="create.placeholderTitle" required>
              </div>

              <div class="field">
                <label for="createBuyer" data-i18n="create.fieldBuyer">Auction Maker</label>
                <input id="createBuyer" name="buyer" type="text" placeholder="Northstar" data-i18n-placeholder="create.placeholderBuyer" required>
              </div>

              <div class="field">
                <label for="createCategory" data-i18n="create.fieldCategory">Category</label>
                <input id="createCategory" name="category" type="text" placeholder="Facilities" data-i18n-placeholder="create.placeholderCategory" required>
              </div>

              <div class="field full-span">
                <label for="createCreatorEmail" data-i18n="create.fieldCreatorEmail">Creator email</label>
                <input id="createCreatorEmail" name="creatorEmail" type="email" placeholder="creator@example.com" data-i18n-placeholder="create.placeholderCreatorEmail" required>
              </div>

              <div class="field full-span">
                <label for="createCreatorPhone" data-i18n="create.fieldCreatorPhone">Auction maker phone number</label>
                <input id="createCreatorPhone" name="creatorPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567" data-i18n-placeholder="create.placeholderCreatorPhone" required>
              </div>

              <div class="field">
                <label for="createVisibility" data-i18n="create.fieldVisibility">Room visibility</label>
                <select id="createVisibility" name="visibility">
                  <option value="public" data-i18n="create.visibilityPublic">Public room</option>
                  <option value="code-only" data-i18n="create.visibilityCodeOnly">Code only</option>
                </select>
              </div>

              <div class="field">
                <label for="createCeiling" data-i18n="create.fieldCeiling">Price</label>
                <input id="createCeiling" name="ceiling" type="number" min="1" step="1" placeholder="125000" data-i18n-placeholder="create.placeholderCeiling" required>
              </div>

              <div class="field">
                <label for="createDropAmount" data-i18n="create.fieldStep">Drop amount</label>
                <input id="createDropAmount" name="dropAmount" type="number" min="1" step="1" placeholder="500" data-i18n-placeholder="create.placeholderStep" required>
              </div>

              <div class="field full-span">
                <label data-i18n="create.fieldDropEvery">Price drops every</label>
                <div class="drop-interval-grid">
                  <div class="field">
                    <label for="createDropDays" data-i18n="create.dropDays">Days</label>
                    <input id="createDropDays" name="dropDays" type="number" min="0" step="1" value="0">
                  </div>
                  <div class="field">
                    <label for="createDropHours" data-i18n="create.dropHours">Hours</label>
                    <input id="createDropHours" name="dropHours" type="number" min="0" step="1" value="0">
                  </div>
                  <div class="field">
                    <label for="createDropMinutes" data-i18n="create.dropMinutes">Minutes</label>
                    <input id="createDropMinutes" name="dropMinutes" type="number" min="0" step="1" value="0">
                  </div>
                </div>
                <p class="helper" data-i18n="create.dropHint">Set any mix above zero.</p>
              </div>

              <div class="field">
                <label for="createDuration" data-i18n="create.fieldDuration">Auction length (hours)</label>
                <input id="createDuration" name="duration" type="number" min="15" step="15" value="60" data-i18n-placeholder="create.placeholderDuration" required>
              </div>

              <div class="field full-span">
                <label for="createNotes" data-i18n="create.fieldNotes">Notes</label>
                <textarea id="createNotes" name="notes" placeholder="Add scope notes, service expectations, or compliance details." data-i18n-placeholder="create.placeholderNotes"></textarea>
              </div>

              <div class="field full-span">
                <label for="createPhotos" data-i18n="create.fieldPhotos">Room photos</label>
                <input id="createPhotos" name="photos" type="file" accept="image/*" multiple>
                <p class="helper" data-i18n="create.photosHint">Add photos that will show in the room.</p>
                <div id="createPhotoPreview" class="photo-gallery photo-preview"></div>
              </div>

              <div class="form-actions full-span">
                <button class="button" type="submit" data-i18n="create.submit">Publish room</button>
                <p class="helper" data-i18n="create.helper">The room opens immediately after publish.</p>
              </div>
            </form>
          </article>
        </section>
      </main>

    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </body>
</html>
