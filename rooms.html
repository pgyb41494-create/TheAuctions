<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Rooms | Yoselins Auctions</title>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="site.css">
    <script defer src="site.js"></script>
  </head>
  <body data-page="auctions">
    <div class="site-shell">
      <header class="site-header panel">
        <a class="brand" href="home.html" aria-label="Yoselins Auctions home">
          <span class="brand-copy">
            <span class="brand-kicker" data-i18n="brand.kicker">Auction workspace</span>
            <strong data-i18n="brand.name">Yoselins Auctions</strong>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="home.html" data-i18n="nav.home">Home</a>
          <a href="create.html" data-i18n="nav.create">Create</a>
          <a href="join.html" data-i18n="nav.join">Join</a>
          <a href="rooms.html" class="is-active" aria-current="page" data-i18n="nav.auctions">Rooms</a>
          <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
          <a href="admin.html" data-nav="admin" data-i18n="nav.admin">Admin</a>
        </nav>

        <button id="languageToggle" class="language-toggle" type="button" aria-label="Switch language">Español</button>
      </header>

      <main class="page-grid auctions-page-grid">
        <section class="panel form-panel filter-panel">
          <div class="section-head compact">
            <div>
              <p class="eyebrow" data-i18n="auctions.filterTitle">Filters</p>
              <h2 data-i18n="auctions.listSubtitle">Find the room you want to inspect.</h2>
            </div>
            <div class="action-row">
              <a class="button button-dark button-small" href="create.html" data-i18n="home.createCta">Create room</a>
              <a class="button button-light button-small" href="join.html" data-i18n="home.joinCta">Enter room</a>
            </div>
          </div>

          <div class="form-grid">
            <div class="field full-span">
              <label for="auctions-search" data-i18n="auctions.searchLabel">Search rooms</label>
              <input id="auctions-search" type="search" placeholder="Title, buyer, category, or code" data-i18n-placeholder="auctions.searchPlaceholder">
            </div>

            <div class="field full-span">
              <label for="auctions-status" data-i18n="auctions.statusLabel">Status</label>
              <select id="auctions-status">
                <option value="all" data-i18n="auctions.statusAll">All rooms</option>
                <option value="open" data-i18n="auctions.statusOpen">Open rooms</option>
                <option value="closed" data-i18n="auctions.statusClosed">Closed rooms</option>
              </select>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="section-head">
            <div>
              <p class="eyebrow" data-i18n="auctions.listTitle">Auction rooms</p>
              <h2 data-i18n="auctions.listSubtitle">Find the room you want to inspect.</h2>
            </div>
            <p class="section-note" data-i18n="auctions.listHint">Only open public rooms appear here.</p>
          </div>

          <div id="auctionsList" class="auction-grid"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </body>
</html>
