<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Apex Reverse Auctions</title>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="site.css" />
    <script defer src="site.js"></script>
  </head>
  <body data-page="home">
    <div class="site-shell">
      <section class="panel hero-panel">
        <div class="action-row">
          <button id="homeAuthButton" class="button button-dark" type="button" data-i18n="home.authPrimary">Sign in</button>
        </div>
        <p class="lede" data-i18n="home.authHint">Use Google to continue.</p>
      </section>

      <header class="site-header panel">
        <a class="brand" href="home.html" aria-label="Apex Reverse Auctions home">
          <span class="brand-mark">RA</span>
          <span class="brand-copy">
            <span class="brand-kicker" data-i18n="brand.kicker">Auction workspace</span>
            <strong data-i18n="brand.name">Apex Reverse Auctions</strong>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="home.html" class="is-active" aria-current="page" data-i18n="nav.home">Home</a>
          <a href="create.html" data-i18n="nav.create">Create</a>
          <a href="join.html" data-i18n="nav.join">Join</a>
          <a href="auctions.html" data-i18n="nav.auctions">Rooms</a>
          <a href="auction.html" data-i18n="nav.room">Room</a>
          <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
          <a href="admin.html" data-nav="admin" data-i18n="nav.admin">Admin</a>
        </nav>

        <button id="languageToggle" class="language-toggle" type="button" aria-label="Switch language">Español</button>
      </header>

      <main class="page-grid home-page-grid">
        <section class="hero-grid">
          <article class="panel hero-panel">
            <p class="eyebrow" data-i18n="home.eyebrow">Simple reverse auctions</p>
            <h1 data-i18n="home.title">Create, join, or browse a room.</h1>
            <p class="lede" data-i18n="home.lede">Pick one button to start.</p>
            <div class="action-row">
              <a class="button button-dark" href="create.html" data-i18n="home.createCta">Create room</a>
              <a class="button button-light" href="join.html" data-i18n="home.joinCta">Enter room</a>
              <a class="button button-ghost" href="auctions.html" data-i18n="home.roomsCta">Browse rooms</a>
            </div>
          </article>
        </section>
      </main>

    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </body>
</html>
