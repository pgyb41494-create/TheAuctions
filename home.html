<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <style id="i18n-boot-style">
      html.i18n-pending [data-i18n],
      html.i18n-pending [data-i18n-placeholder],
      html.i18n-pending #languageToggle,
      html.i18n-pending .header-sign-out {
        visibility: hidden;
      }
    </style>
    <script src="i18n-boot.js"></script>
    <title>Yoselins Auctions</title>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="site.css">
    <script defer src="site.js"></script>
  </head>
  <body data-page="home">
    <div class="site-shell">
      <header class="site-header panel">
        <a class="brand" href="home.html" aria-label="Yoselins Auctions home">
          <span class="brand-copy">
            <span class="brand-kicker" data-i18n="brand.kicker">Auction workspace</span>
            <strong data-i18n="brand.name">Yoselins Auctions</strong>
          </span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="home.html" class="is-active" aria-current="page" data-i18n="nav.home">Home</a>
          <a href="create.html" data-i18n="nav.create">Create</a>
          <a href="join.html" data-i18n="nav.join">Join</a>
          <a href="rooms.html" data-i18n="nav.auctions">Rooms</a>
          <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
          <a href="admin.html" data-nav="admin" data-i18n="nav.admin">Admin</a>
        </nav>

        <div class="header-actions">
          <button id="homeAuthButton" class="button button-dark button-small" type="button" data-i18n="home.authPrimary" aria-haspopup="dialog" aria-controls="homeAuthModal" aria-expanded="false">Sign in</button>
          <button id="languageToggle" class="language-toggle" type="button" aria-label="Switch language">Español</button>
        </div>
      </header>

      <main class="page-grid home-page-grid">
        <section class="hero-grid">
          <article class="panel hero-panel">
            <p class="eyebrow" data-i18n="home.eyebrow">Simple reverse auctions</p>
            <h1 data-i18n="home.title">Create or join a room.</h1>
            <p class="lede" data-i18n="home.lede">Pick one button to start.</p>
            <div class="action-row">
              <a class="button button-dark" href="create.html" data-i18n="home.createCta">Create room</a>
              <a class="button button-light" href="join.html" data-i18n="home.joinCta">Enter room</a>
            </div>
          </article>
        </section>
      </main>

    </div>

    <div id="homeAuthModal" class="auth-modal-overlay" hidden>
      <div class="auth-modal panel" role="dialog" aria-modal="true" aria-labelledby="homeAuthModalTitle" aria-describedby="homeAuthModalHint">
        <button id="homeAuthModalClose" class="auth-modal-close" type="button" aria-label="Close">×</button>

        <div class="auth-modal-copy">
          <h2 id="homeAuthModalTitle">Sign in to Your Account</h2>
          <p id="homeAuthModalHint" class="auth-modal-subtitle">Enter your email to continue.</p>
        </div>

        <form id="homeAuthForm" class="auth-modal-form">
          <label class="auth-modal-field" for="homeAuthEmail">
            <span id="homeAuthEmailLabel">Email Address</span>
            <input id="homeAuthEmail" class="auth-modal-input" type="email" placeholder="Enter Your Email" autocomplete="email">
          </label>

          <label id="homeAuthPasswordField" class="auth-modal-field" for="homeAuthPassword" hidden>
            <span id="homeAuthPasswordLabel">Password</span>
            <input id="homeAuthPassword" class="auth-modal-input" type="password" placeholder="Enter your password" autocomplete="current-password">
          </label>

          <button id="homeAuthPrimaryButton" class="auth-modal-primary" type="submit">Next</button>
          <button id="homeAuthResetButton" class="auth-modal-reset" type="button">Reset Password</button>

          <div class="auth-modal-divider" aria-hidden="true">
            <span id="homeAuthDividerText">or</span>
          </div>

          <button id="homeAuthGoogleButton" class="auth-modal-google-button" type="button">
            <span class="auth-modal-google-icon" aria-hidden="true">G</span>
            <span id="homeAuthGoogleButtonLabel">Sign in with Google</span>
          </button>

          <button id="homeAuthBackButton" class="auth-modal-back" type="button" hidden>Use another email</button>
          <p id="homeAuthError" class="auth-modal-error" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>
  </body>
</html>
